<style>
  :root{
    color-scheme: dark;
    --bg:#0f1013; --bg2:#171a1f; --card:#1b1e24; --card2:#22262e;
    --line:rgba(255,255,255,.09); --text:#f2f3f5; --muted:#8d94a0;
    --accent:#f5a524; --accent2:#ffc258; --ok:#3ddc84; --danger:#ff6b5e;
    --r:16px; --nav:56px;
  }
  html[data-theme="light"]{
    color-scheme: light;
    --bg:#f6f4f1; --bg2:#fffdfa; --card:#ffffff; --card2:#f3efea;
    --line:rgba(60,50,40,.14); --text:#191512; --muted:#8a8177;
    --accent:#d97706; --accent2:#b45309; --ok:#1f9d55; --danger:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);overflow-x:hidden;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 8px)}
  button,input,textarea,select{font-family:inherit}
  a{color:inherit}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
    background:color-mix(in srgb, var(--bg2) 86%, transparent);backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;
    background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
  .nav-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .nav-btn.on{color:var(--accent)}

  .page{padding:14px 16px 0;animation:fade .18s ease}

  h1{font-size:26px;letter-spacing:-.02em;margin:0;font-weight:750}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 10px}
  .sub{color:var(--muted);font-size:13.5px;margin-top:3px}

  .day-head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;

  .slot:last-child{border-bottom:0}
  .slot .meal{width:72px;flex:0 0 72px;font-size:11.5px;color:var(--muted);text-transform:uppercase;

  .del{background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:4px}

  .shop-cat{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);

  .shop-item{display:flex;align-items:center;gap:11px;padding:12px 14px;background:var(--card);

  .sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
  .sheet-in{width:100%;max-height:82vh;background:var(--bg2);border-radius:22px 22px 0 0;

  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .pick{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--card);
    border:1px solid var(--line);border-radius:13px;margin-bottom:7px;cursor:pointer;font-size:15px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 18px);
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 15px;
    font-size:14px;z-index:80;box-shadow:0 12px 40px rgba(0,0,0,.45);max-width:320px;text-align:center}
  @media (min-width:620px){
    body{max-width:460px;margin:0 auto;background:var(--bg2);box-shadow:0 0 0 1px var(--line)}
    html{background:#0b0a09}
    .nav{left:50%;right:auto;transform:translateX(-50%);width:460px}
  }
</style>

/* берём цвета из темы Телеграма, чтобы приложение не спорило с ним */
function applyTheme(mode) {

  localStorage.setItem('theme', m);

function applyTelegramTheme() {

  if (!t || !tg.initData) return;
  if (localStorage.getItem('theme') && localStorage.getItem('theme') !== 'auto') return;
  const root = document.documentElement.style;

    bg_color: '--bg', secondary_bg_color: '--bg2', text_color: '--text',
    hint_color: '--muted', button_color: '--accent', link_color: '--accent2',
    destructive_text_color: '--danger',

function route() {
  const h = location.hash.replace(/^#\/?/, '');

  if (view === 'list') renderList();
  if (view === 'plan') renderPlan();

  if (view === 'settings') renderSettings();
  if (view === 'pantry') renderPantry();
}

async function loadMeta() {
  const meta = await api('/api/meta');
  if (meta) {
    state.meta = meta; state.settings = meta.settings || {};
    if (meta.settings && meta.settings.theme) applyTheme(meta.settings.theme);
    return;
  }
  const all = await staticRecipes();
  const cats = {};
  all.forEach(r => { if (r.category) cats[r.category] = (cats[r.category] || 0) + 1; });
  state.meta = {
    categories: Object.entries(cats).map(([name, count]) => ({ name, count })),
    tags: [], stats: { recipes: all.length, favorites: all.filter(r => r.favorite).length }
  };
}

async function loadList() {
  const f = state.filters;
  const have = (f.have || '').trim();
  if (have) return renderSuggest(have);

  const clean = !f.q && !f.category && !f.favorite && !f.max_time;
  const box = document.getElementById('list');
  if (clean && SEED_INDEX && SEED_INDEX.length && box) {
    box.innerHTML = SEED_INDEX.map(cardHtml).join('');     // мгновенный первый экран
    bindFav();
  }

  let items = await api(`/api/recipes?q=${encodeURIComponent(f.q)}&category=${encodeURIComponent(f.category)}&favorite=${f.favorite ? 1 : 0}&max_time=${f.max_time || 0}`);
  if (!items && SEED_INDEX && clean) items = SEED_INDEX;
  if (!items) {
    items = await staticRecipes();
    if (f.q) items = items.filter(r => (r.title + ' ' + (r.ingredients || []).join(' ')).toLowerCase().includes(f.q.toLowerCase()));
    if (f.category) items = items.filter(r => r.category === f.category);
    if (f.favorite) items = items.filter(r => r.favorite);
    if (f.max_time) items = items.filter(r => (r.time_min || 999) <= f.max_time);
  }

  if (!box) return;
  if (!items.length) {
    box.innerHTML = `<div class="empty">Ничего не нашлось.<br>Измени поиск или пришли боту ссылку на новое блюдо.</div>`;
    return;
  }
  box.innerHTML = items.map(cardHtml).join('');
  bindFav();
}

function bindFav() {
  $$('.fav').forEach(b => b.onclick = async e => {
    e.preventDefault(); e.stopPropagation();
    try {
      const res = await post('/api/favorite', { id: b.dataset.id });
      b.textContent = res.favorite ? '★' : '☆';
      b.style.color = res.favorite ? 'var(--accent)' : 'var(--muted)';
      vibe();
    } catch (err) { toast('Избранное: ' + err.message); }
  });
}

function cardHtml(r) {

async function openRecipe(id) {
  drawNav('list');
  document.getElementById('app').innerHTML =
    `<div class="page"><div class="sk" style="height:220px"></div><div class="sk"></div><div class="sk"></div></div>`;

  let r = await api(`/api/recipe?id=${encodeURIComponent(id)}`);
  if (!r) r = await staticRecipe(id);
  if (!r || r.error) {
    document.getElementById('app').innerHTML = `<div class="page"><a class="back" href="#/">‹ Назад</a>
      <div class="empty" style="padding-top:80px">Рецепт не найден.<br>Возможно, его удалили.</div></div>`;

  state.recipe = r; state.id = id;

function scaleQty(qty, ratio) {
  if (!qty || ratio === 1) return qty;
  return String(qty).replace(/(\d+([.,]\d+)?)/, m => {
    const num = parseFloat(m.replace(',', '.')) * ratio;
    return (Math.round(num * 10) / 10).toString().replace('.', ',');
  });
}

/* ─── правка ─── */
function enterEdit(id) {
  const r = state.recipe;
  const draft = {
    title: r.title || '', category: r.category || '',
    time_min: r.time_min || '', servings: r.servings || '',
    ingredients: (r.ingredients || []).map(x => ({ ...x })),
    steps: (r.steps || []).map(s => ({ ...s })),
  };
  const draw = () => {
    document.getElementById('app').innerHTML = `<div class="page">
      <h1 style="margin-bottom:14px">Правка</h1>
      <input class="edit-input" id="eTitle" value="${esc(draft.title)}" placeholder="Название" style="width:100%">
      <div class="row" style="margin-top:8px">
        <input class="edit-input" id="eCat" value="${esc(draft.category)}" placeholder="категория">
        <input class="edit-input" id="eTime" value="${esc(draft.time_min)}" placeholder="мин" style="flex:0 0 28%">
        <input class="edit-input" id="eServ" value="${esc(draft.servings)}" placeholder="порц" style="flex:0 0 28%">
      </div>
      <h2>Ингредиенты</h2>
      ${draft.ingredients.map((x, i) => `
        <div class="edit-row">
          <input class="edit-input" data-in="${i}" value="${esc(x.name || '')}" placeholder="что">
          <input class="edit-input qty" data-iq="${i}" value="${esc(x.qty || '')}" placeholder="сколько">
          <button class="x" data-di="${i}">✕</button>
        </div>`).join('')}
      <button class="add" id="addIng">+ ингредиент</button>
      <h2>Шаги</h2>
      ${draft.steps.map((s, i) => `
        <div class="edit-row" style="align-items:flex-start">
          <textarea class="edit-area" data-st="${i}" placeholder="шаг ${i + 1}">${esc(s.text || '')}</textarea>
          <button class="x" data-ds="${i}">✕</button>
        </div>`).join('')}
      <button class="add" id="addStep">+ шаг</button>
      <div class="actions">
        <button class="btn" id="eCancel">Отмена</button>
        <button class="btn primary" id="eSave">Сохранить</button>
      </div>
      <div style="height:16px"></div>
    </div>`;

    document.getElementById('eTitle').oninput = e => draft.title = e.target.value;
    document.getElementById('eCat').oninput = e => draft.category = e.target.value;
    document.getElementById('eTime').oninput = e => draft.time_min = e.target.value;
    document.getElementById('eServ').oninput = e => draft.servings = e.target.value;
    $$('[data-in]').forEach(el => el.oninput = e => draft.ingredients[+e.target.dataset.in].name = e.target.value);
    $$('[data-iq]').forEach(el => el.oninput = e => draft.ingredients[+e.target.dataset.iq].qty = e.target.value);
    $$('[data-st]').forEach(el => el.oninput = e => draft.steps[+e.target.dataset.st].text = e.target.value);
    $$('[data-di]').forEach(el => el.onclick = e => {
      const i = +e.target.dataset.di;
      if (draft.ingredients.length <= 1) return toast('Оставь хотя бы один ингредиент');
      draft.ingredients.splice(i, 1); draw();
    });
    $$('[data-ds]').forEach(el => el.onclick = e => {
      const i = +e.target.dataset.ds;
      if (draft.steps.length <= 1) return toast('Оставь хотя бы один шаг');
      draft.steps.splice(i, 1); draw();
    });
    document.getElementById('addIng').onclick = () => { draft.ingredients.push({ name: '', qty: '' }); draw(); };
    document.getElementById('addStep').onclick = () => { draft.steps.push({ text: '', at: '' }); draw(); };
    document.getElementById('eCancel').onclick = () => drawRecipe();

    document.getElementById('eSave').onclick = async () => {
      const btn = document.getElementById('eSave');
      btn.textContent = 'Сохраняю…';
      try {
        const clean = {
          title: draft.title.trim() || 'Без названия',
          category: draft.category.trim(),
          time_min: draft.time_min ? Number(draft.time_min) : null,
          servings: draft.servings ? Number(draft.servings) : null,
          ingredients: draft.ingredients.filter(x => (x.name || '').trim())
            .map(x => ({ ...x, name: x.name.trim(), qty: (x.qty || '').trim() })),
          steps: draft.steps.filter(s => (s.text || '').trim())
            .map((s, i) => ({ n: i + 1, text: s.text.trim(), at: s.at || '' })),
        };
        if (!clean.ingredients.length || !clean.steps.length) throw new Error('нужен хотя бы один ингредиент и шаг');
        await post('/api/save', { id, recipe: clean });
        state.recipe = { ...state.recipe, ...clean };
        toast('Сохранено');
        drawRecipe();
      } catch (e) {
        btn.textContent = 'Сохранить';
        toast('Не сохранилось: ' + e.message, 4000);
      }
    };
  };
  draw();
}

async function removeRecipe(id, title) {
  const ask = `Удалить «${title}»?`;
  const ok = tg?.showConfirm ? await new Promise(res => tg.showConfirm(ask, res)) : window.confirm(ask);
  if (!ok) return;
  try {
    await post('/api/delete', { id });
    toast('Удалено');
    location.hash = '#/';
  } catch (e) { toast('Не удалилось: ' + e.message, 4000); }
}

/* ─── 3. план ─── */
const MEALS = [['breakfast', 'Завтрак'], ['lunch', 'Обед'], ['dinner', 'Ужин']];
const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

function isoWeekStart(offset = 0) {
  const d = new Date();
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day + offset * 7);
  return d;
}

async function renderPlan(weekOffset = 0) {
  drawNav('plan');
  const start = isoWeekStart(weekOffset);
  const startStr = start.toISOString().slice(0, 10);
  const endStr = new Date(start.getTime() + 6 * 86400000).toISOString().slice(0, 10);
  const plan = await api(`/api/plan?start=${startStr}&end=${endStr}`) || { items: [] };
  const byKey = {};
  (plan.items || []).forEach(i => byKey[`${i.date}|${i.meal}`] = i);

  const days = [...Array(7)].map((_, i) => {
    const d = new Date(start.getTime() + i * 86400000);
    return { iso: d.toISOString().slice(0, 10), label: `${WD[i]}, ${d.getDate()}.${String(d.getMonth() + 1).padStart(2, '0')}` };
  });
  const today = new Date().toISOString().slice(0, 10);

  document.getElementById('app').innerHTML = `<div class="page">
    <div class="row" style="justify-content:space-between">
      <div><h1>План</h1><div class="sub">${startStr} — ${endStr}</div></div>
      <div class="row" style="gap:6px">
        <button class="btn ghost" id="wPrev" style="padding:9px 12px">‹</button>
        <button class="btn ghost" id="wNext" style="padding:9px 12px">›</button>
      </div>
    </div>
    <div style="margin-top:14px">
      ${days.map(d => `
        <div class="day">
          <div class="day-head">${d.label} ${d.iso === today ? '<small>сегодня</small>' : ''}</div>
          ${MEALS.map(([meal, label]) => {
            const it = byKey[`${d.iso}|${meal}`];
            return `<div class="slot" data-date="${d.iso}" data-meal="${meal}">
              <div class="meal">${label}</div>
              <div class="what ${it ? '' : 'muted'}">${it ? esc(it.emoji || '🍽') + ' ' + esc(it.title || '') : 'добавить блюдо'}</div>
              ${it ? `<button class="del" data-clear="${d.iso}|${meal}">✕</button>` : ''}
            </div>`;
          }).join('')}
        </div>`).join('')}
    </div>
    <button class="btn primary" id="planShop" style="width:100%;margin:6px 0 12px">🛒 Покупки на эту неделю</button>
  </div>`;

  document.getElementById('wPrev').onclick = () => renderPlan(weekOffset - 1);
  document.getElementById('wNext').onclick = () => renderPlan(weekOffset + 1);
  $$('.slot').forEach(el => el.onclick = e => {
    if (e.target.dataset.clear) return;
    pickRecipe(el.dataset.date, el.dataset.meal);
  });
  $$('[data-clear]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const [date, meal] = b.dataset.clear.split('|');
    try { await post('/api/plan', { action: 'clear', date, meal }); renderPlan(weekOffset); }
    catch (err) { toast('Не вышло: ' + err.message); }
  });
  document.getElementById('planShop').onclick = async () => {
    const ids = [...new Set(((plan.items) || []).map(i => i.recipe_id))];
    if (!ids.length) return toast('В плане пока пусто');
    try {
      const res = await post('/api/shopping', { action: 'build', recipes: ids, replace: true });
      toast(`В покупках ${res.items.length} позиций`);
      location.hash = '#/shop';
    } catch (e) { toast('Не вышло: ' + e.message); }
  };
}

async function pickRecipe(date, meal) {
  const items = (await api('/api/recipes')) || (await staticRecipes());
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = `<div class="sheet-in">
    <div class="sheet-head"><b>Что поставить?</b>
      <button class="btn ghost" id="close" style="padding:8px 12px">Закрыть</button></div>
    <input class="input" id="pq" placeholder="поиск" style="margin-bottom:10px">
    <div id="plist">${(items || []).map(r => `<div class="pick" data-rid="${r.id}">
      <span>${esc(r.emoji || '🍽')} ${esc(r.title)}</span>
      <span style="color:var(--muted);font-size:13px">${r.time_min ? r.time_min + ' мин' : ''}</span>
    </div>`).join('')}</div>
  </div>`;
  document.body.appendChild(sheet);
  const close = () => sheet.remove();
  sheet.onclick = e => { if (e.target === sheet) close(); };
  sheet.querySelector('#close').onclick = close;
  sheet.querySelector('#pq').oninput = e => {
    const v = e.target.value.toLowerCase();
    sheet.querySelectorAll('.pick').forEach(p => p.style.display = p.textContent.toLowerCase().includes(v) ? '' : 'none');
  };
  sheet.querySelectorAll('.pick').forEach(p => p.onclick = async () => {
    try {
      await post('/api/plan', { action: 'set', date, meal, recipe_id: p.dataset.rid });
      close(); renderPlan();
    } catch (err) { toast('Не вышло: ' + err.message); }
  });
}

/* ─── 4. покупки ─── */
async function renderShop() {
  drawNav('shop');
  const items = (await api('/api/shopping')) || [];
  const groups = {};
  items.forEach(i => (groups[i.cat || 'Прочее'] ||= []).push(i));
  const total = items.length, done = items.filter(i => i.done).length;

  document.getElementById('app').innerHTML = `<div class="page">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><h1>Покупки</h1><div class="sub">${total ? `${done} из ${total} куплено` : 'список пуст'}</div></div>
      ${done ? `<button class="btn ghost" id="clearDone" style="padding:9px 12px;font-size:13.5px">Убрать купленное</button>` : ''}
    </div>
    <div class="row" style="margin-top:14px">
      <input class="input" id="addName" placeholder="добавить продукт">
      <button class="btn primary" id="addBtn" style="padding:12px 16px">＋</button>
    </div>
    ${total ? Object.entries(groups).map(([cat, list]) => `
      <div class="shop-cat">${esc(cat)}</div>
      ${list.map(i => `<div class="shop-item ${i.done ? 'done' : ''}">
        <div class="box" data-toggle="${i.id}" style="${i.done ? 'background:var(--ok);border-color:var(--ok)' : ''}">
          <svg viewBox="0 0 24 24" fill="none" stroke="#08150e" stroke-width="3.4" stroke-linecap="round"
            stroke-linejoin="round" style="opacity:${i.done ? 1 : 0}"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="shop-name" data-toggle="${i.id}">${esc(i.name)}</div>
        <div class="shop-qty">${i.qty != null ? `${i.qty} ${esc(i.unit || '')}` : ''}</div>
        <button class="del" data-del="${i.id}">✕</button>
      </div>`).join('')}`).join('')
      : `<div class="empty">Список пуст.<br>Собери из рецепта (🛒 в карточке) или из плана недели.</div>`}
    <div style="height:16px"></div>
  </div>`;

  document.getElementById('addBtn').onclick = async () => {
    const name = document.getElementById('addName').value.trim();
    if (!name) return;
    try { await post('/api/shopping', { action: 'add', name }); renderShop(); }
    catch (e) { toast('Не вышло: ' + e.message); }
  };
  document.getElementById('addName').onkeydown = e => { if (e.key === 'Enter') document.getElementById('addBtn').click(); };
  $$('[data-toggle]').forEach(el => el.onclick = async () => {
    try { await post('/api/shopping', { action: 'toggle', id: +el.dataset.toggle }); renderShop(); }
    catch (e) { toast('Не вышло: ' + e.message); }
  });
  $$('[data-del]').forEach(el => el.onclick = async () => {
    try { await post('/api/shopping', { action: 'delete', id: +el.dataset.del }); renderShop(); }
    catch (e) { toast('Не вышло: ' + e.message); }
  });
  document.getElementById('clearDone')?.addEventListener('click', async () => {
    try { await post('/api/shopping', { action: 'clear', done_only: true }); renderShop(); }
    catch (e) { toast('Не вышло: ' + e.message); }
  });
}

/* ─── 4.5 кладовка ─── */
async function renderPantry() {
  drawNav('list');
  const items = (await api('/api/pantry')) || [];
  const have = items.filter(i => i.have).map(i => i.name);

  document.getElementById('app').innerHTML = `<div class="page">
    <a class="back" href="#/">‹ Рецепты</a>
    <div style="padding-top:34px">
      <h1>Кладовка</h1>
      <div class="sub">Отметь, что есть дома. Приложение не угадывает — только твои галочки.</div>

      <div class="chips" style="margin-top:16px;flex-wrap:wrap;overflow:visible">
        ${items.map(i => `
          <button class="chip ${i.have ? 'on' : ''}" data-pid="${i.id}" style="display:inline-flex;gap:7px;align-items:center">
            ${i.have ? '✓' : '○'} ${esc(i.name)}
            <span data-delp="${i.id}" style="opacity:.55;font-weight:700;padding:0 2px">✕</span>
          </button>`).join('') || '<div class="sub">Список пуст — добавь продукты ниже</div>'}
      </div>

      <div class="row" style="margin-top:18px">
        <input class="input" id="pName" placeholder="добавить продукт">
        <button class="btn primary" id="pAdd" style="padding:12px 16px">＋</button>
      </div>

      <button class="btn primary" id="pFind" ${have.length ? '' : 'disabled'}
        style="width:100%;margin-top:18px${have.length ? '' : ';opacity:.45'}">
        Подобрать рецепты (${have.length})
      </button>

      ${have.length ? `<button class="btn ghost" id="pClear" style="width:100%;margin-top:8px">Снять все галочки</button>` : ''}
      <div style="height:20px"></div>
    </div>
  </div>`;

  document.getElementById('pAdd').onclick = async () => {
    const name = document.getElementById('pName').value.trim();
    if (!name) return;
    try { await post('/api/pantry', { action: 'add', name }); renderPantry(); }
    catch (e) { toast('Не вышло: ' + e.message); }
  };
  document.getElementById('pName').onkeydown = e => { if (e.key === 'Enter') document.getElementById('pAdd').click(); };

  $$('[data-delp]').forEach(el => el.onclick = async e => {
    e.stopPropagation();
    try { await post('/api/pantry', { action: 'delete', id: +el.dataset.delp }); renderPantry(); }
    catch (err) { toast('Не вышло: ' + err.message); }
  });
  $$('[data-pid]').forEach(el => el.onclick = async () => {
    try { await post('/api/pantry', { action: 'toggle', id: +el.dataset.pid }); renderPantry(); }
    catch (err) { toast('Не вышло: ' + err.message); }
  });
  document.getElementById('pClear')?.addEventListener('click', async () => {
    try { await post('/api/pantry', { action: 'clear_have' }); renderPantry(); }
    catch (e) { toast('Не вышло: ' + e.message); }
  });
  document.getElementById('pFind').onclick = () => {
    if (!have.length) return toast('Отметь хотя бы один продукт');
    state.filters.have = have.join(', ');
    location.hash = '#/';
  };
}

/* ─── 5. настройки ─── */
async function renderSettings() {
  drawNav('settings');
  if (!(state.meta && state.meta.stats && state.meta.stats.recipes)) await loadMeta();   // прямой вход в настройки
  const s = (await api('/api/settings')) || state.settings || {};
  const stats = (state.meta && state.meta.stats) || {};
  const parse = v => { try { return JSON.parse(v || '[]').join(', '); } catch { return ''; } };

  document.getElementById('app').innerHTML = `<div class="page">
    <h1>Настройки</h1>
    <div class="sub">Сохраняются в базе на маке</div>

    <h2>Вид</h2>
    <div class="row" style="gap:8px;padding:4px 0">
      <button class="chip ${s.theme === 'light' ? 'on' : ''}" id="thLight">Светлая</button>
      <button class="chip ${s.theme !== 'light' ? 'on' : ''}" id="thDark">Тёмная</button>
    </div>

    <h2>Готовка</h2>
    <div class="row" style="justify-content:space-between;padding:8px 0">
      <div class="grow">Порций по умолчанию</div>
      <input class="input" id="sServ" value="${esc(s.default_servings || '2')}" style="width:80px;text-align:center">
    </div>
    <div class="row" style="justify-content:space-between;padding:8px 0">
      <div class="grow">Максимум времени, мин</div>
      <input class="input" id="sTime" value="${esc(s.max_time || '')}" placeholder="—" style="width:80px;text-align:center">
    </div>

    <h2>Ограничения</h2>
    <div class="sub" style="margin-bottom:8px">Исключаемые ингредиенты</div>
    <input class="input" id="sExcl" value="${esc(parse(s.exclude))}" placeholder="кинза, грибы">
    <div class="sub" style="margin:14px 0 8px">Аллергены</div>
    <input class="input" id="sAllerg" value="${esc(parse(s.allergens))}" placeholder="орехи, лактоза">

    <h2>ИИ</h2>
    <div class="note">
      Модель нужна только при импорте ссылки или текста — превратить расшифровку в рецепт.
      Поиск, фильтры, избранное, план, покупки и правка работают без неё.
    </div>

    <button class="btn primary" id="saveSet" style="width:100%;margin-top:16px">Сохранить</button>

    <h2>Данные</h2>
    <div class="note">Рецептов: <b>${stats.recipes ?? '—'}</b> · в избранном: <b>${stats.favorites ?? '—'}</b>
      ${stats.size_kb ? `<br><span class="sub">База: ${stats.size_kb} КБ</span>` : ''}</div>
    <div class="note warn">Резервная копия: <code>data/recipes.db</code> + скрипт <code>scripts/backup.py</code></div>
    <div style="height:20px"></div>
  </div>`;

  let themeChoice = s.theme === 'light' ? 'light' : 'dark';
  const paintTheme = () => {
    document.getElementById('thLight').classList.toggle('on', themeChoice === 'light');
    document.getElementById('thDark').classList.toggle('on', themeChoice !== 'light');
  };
  document.getElementById('thLight').onclick = () => { themeChoice = 'light'; applyTheme('light'); paintTheme(); };
  document.getElementById('thDark').onclick = () => { themeChoice = 'dark'; applyTheme('dark'); paintTheme(); };

  document.getElementById('saveSet').onclick = async () => {
    const patch = {
      default_servings: document.getElementById('sServ').value.trim() || '2',
      max_time: document.getElementById('sTime').value.trim(),
      exclude: JSON.stringify(document.getElementById('sExcl').value.split(',').map(x => x.trim()).filter(Boolean)),
      allergens: JSON.stringify(document.getElementById('sAllerg').value.split(',').map(x => x.trim()).filter(Boolean)),
      theme: themeChoice,
    };
    try {
      state.settings = (await post('/api/settings', { patch })) || { ...s, ...patch };
      toast('Настройки сохранены');
    } catch (e) { toast('Не сохранилось: ' + e.message, 4000); }
  };
}

route();
</script>
</body>
